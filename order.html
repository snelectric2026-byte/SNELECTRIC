<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تقديم طلب - SNelectric</title>
</head>
<body>
  <h1>تقديم طلب</h1>
  <form id="order-form">
    <label>الاسم (اختياري)<br><input type="text" id="display_name" /></label><br>
    <label>رقم الهاتف<br><input type="text" id="phone" required /></label><br>
    <label>تفاصيل الطلب<br><textarea id="items" required></textarea></label><br>
    <label>المبلغ الإجمالي<br><input type="number" id="total" step="0.01" required /></label><br>
    <button type="submit">تقديم الطلب</button>
  </form>

  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/orders.js"></script>
  <script>
    const form = document.getElementById('order-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const display_name = document.getElementById('display_name').value.trim();
      const itemsText = document.getElementById('items').value.trim();
      const total = parseFloat(document.getElementById('total').value) || 0;
      if (!phone || !itemsText) return alert('رجاءً ادخل رقم الهاتف وتفاصيل الطلب');

      // login/create user and session
      const user = await loginWithPhone(phone, display_name);
      const items = { text: itemsText };
      await submitOrder({ items, total, phone });
    });
  </script>
</body>
</html>
