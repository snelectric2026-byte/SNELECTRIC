<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNelectric - مخططات معمارية وكهربائية</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f19;
            color: #ffffff;
        }

        /* --- الشريط العلوي المدمج --- */
        .top-bar {
            height: 50px;
            background: rgba(18, 25, 41, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0, 242, 254, 0.4);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 4px 12px; 
            z-index: 100;
            gap: 8px;
        }

        /* تصغير الشعار */
        .brand { font-size: 13px; font-weight: 900; white-space: nowrap; display: flex; align-items: center; gap: 2px; }
        .logo-sn { color: #0066ff; } 
        .logo-bolt { color: #ff0000; font-size: 11px; } 
        .logo-electric { color: #00f2fe; font-size: 11px; opacity: 0.9; }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* أزرار مضغوطة بالرموز فقط */
        .btn-icon { 
            height: 36px;
            min-width: 36px;
            padding: 0 8px;
            border: 1.5px solid rgba(0, 242, 254, 0.5); 
            background: rgba(0, 242, 254, 0.1); 
            color: #fff;
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .btn-icon:hover {
            background: #00f2fe;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }
        .btn-icon:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.05);
            border-color: transparent;
        }

        /* --- الهيكل الرئيسي --- */
        .app-layout { 
            display: flex; 
            height: calc(100vh - 50px); 
            width: 100vw;
            position: relative; 
            overflow: hidden; 
        }

        .canvas-container-wrapper {
            flex: 1; 
            height: 100%; 
            position: relative; 
            background-color: #0d1322;
            background-image: linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 25px 25px;
            touch-action: none;
        }

        /* --- القائمة الجانبية --- */
        .sidebar {
            width: 300px; 
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            border-left: 2px solid rgba(0, 242, 254, 0.3); 
            display: flex; 
            flex-direction: column; 
            z-index: 20; 
            transition: transform 0.3s ease;
        }

        .sidebar-scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .sidebar { 
                position: absolute; top: 0; right: 0; bottom: 0; 
                width: 85%; max-width: 300px; 
                transform: translateX(100%); 
            }
            .sidebar.active { transform: translateX(0); }
        }

        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        .btn-oval {
            padding: 8px; border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff; font-size: 11px; cursor: pointer; text-align: center; 
            font-weight: 700;
        }
        .btn-oval:hover { background: rgba(0, 242, 254, 0.3); border-color: #00f2fe; }

        .accordion-header { 
            background: rgba(0, 242, 254, 0.15); 
            padding: 8px 10px; border-radius: 8px; 
            font-weight: 800; font-size: 12px; cursor: pointer; 
            display: flex; justify-content: space-between;
            border: 1px solid rgba(0, 242, 254, 0.4); color: #00f2fe;
        }

        .accordion-content { display: none; grid-template-columns: 1fr 1fr; gap: 6px; padding-top: 6px; }
        .accordion-content.show { display: grid; }
        .accordion-content button { 
            padding: 6px; font-size: 10px; background: rgba(255, 255, 255, 0.05); 
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; cursor: pointer; 
        }

        .floating-action-group {
            position: absolute; display: none; z-index: 100;
            transform: translate(-50%, -120%);
            gap: 6px;
        }
        .floating-btn {
            background: #121929; border: 1.5px solid #00f2fe; color: white;
            border-radius: 50%; width: 32px; height: 32px; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* النافذة المنبثقة */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.88); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-card {
            background: #121929; border: 2px solid #00f2fe;
            border-radius: 12px; width: 90%; max-width: 400px; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }
    </style>
</head>
<body>

    <div id="floatingActionGroup" class="floating-action-group">
        <button id="floatingDuplicateBtn" class="floating-btn" title="تكرار">📋</button>
        <button id="floatingDeleteBtn" class="floating-btn" style="border-color:#ff007f;" title="حذف">🗑️</button>
    </div>

    <div class="modal-overlay" id="roomInputModal">
        <div class="modal-card">
            <h3 id="roomModalTitle" style="color:#00f2fe; font-size:14px;">🏠 إضافة أبعاد الغرفة</h3>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="inputRoomLength" value="4.0" step="0.1" placeholder="الطول (م)" style="width:50%; padding:8px; border-radius:6px; border:1px solid #00f2fe; background:#000; color:#fff;">
                <input type="number" id="inputRoomWidth" value="3.0" step="0.1" placeholder="العرض (م)" style="width:50%; padding:8px; border-radius:6px; border:1px solid #00f2fe; background:#000; color:#fff;">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn-oval" onclick="closeRoomModal()">إلغاء</button>
                <button class="btn-oval" style="background:#00f2fe; color:#000;" onclick="confirmAddRoom()">إضافة 📐</button>
            </div>
        </div>
    </div>

    <header class="top-bar">
        <div class="brand">
            <span class="logo-sn">S</span><span class="logo-bolt">⚡</span><span class="logo-sn">N</span> 
            <span class="logo-electric">(elec)</span>
        </div>

        <div class="top-actions">
            <button id="btnUndo" class="btn-icon" disabled title="تراجع">↩️</button>
            <button id="btnRedo" class="btn-icon" disabled title="إعادة">↪️</button>
            <button id="btnPlay" class="btn-icon" title="تشغيل / معاينة">▶</button>
            <button id="btnStop" class="btn-icon" title="إيقاف">⏹</button>
            <button id="btnAddText" class="btn-icon" title="إضافة نص / مقاس">📝</button>
            <button id="btnSave" class="btn-icon" title="حفظ المخطط">💾</button>
            <button id="btnToggleSidebar" class="btn-icon" title="الأدوات">🛠️</button>
        </div>
    </header>

    <div class="app-layout">
        <main class="canvas-container-wrapper" id="canvasWrapper">
            <canvas id="c"></canvas>
        </main>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-scroll-content">
                <div class="tools-grid">
                    <button class="btn-oval" onclick="openRoomModal('غرفة')">🏠 إضافة غرفة</button>
                    <button class="btn-oval" onclick="addTextDimension()">📐 إضافة كتابة مقاس</button>
                </div>

                <div class="accordion-header" onclick="toggleAccordion('elecAccordion')">
                    ⚡ الرموز الكهربائية <span>▼</span>
                </div>
                <div class="accordion-content" id="elecAccordion">
                    <button onclick="addSymbol('socket', 'بريز كهرباء')">🔌 بريز</button>
                    <button onclick="addSymbol('switch', 'مفتاح إنارة')">🔘 مفتاح</button>
                    <button onclick="addSymbol('light', 'وحدة إضاءة')">💡 إضاءة</button>
                    <button onclick="addSymbol('panel', 'لوحة توزيع')">🎛️ لوحة</button>
                </div>

                <div class="accordion-header" onclick="toggleAccordion('furnitureAccordion')">
                    🚪 الأبواب والأثاث <span>▼</span>
                </div>
                <div class="accordion-content" id="furnitureAccordion">
                    <button onclick="addSymbol('door', 'باب')">🚪 باب</button>
                    <button onclick="addSymbol('window', 'شباك')">🪟 شباك</button>
                </div>

                <button class="btn-oval" style="background:rgba(247, 37, 133, 0.2); border-color:#ff4d6d; color:#ff4d6d; margin-top:auto;" onclick="clearCanvas()">🗑️ مسح الكل</button>
            </div>
        </aside>
    </div>

    <script>
        let canvas;
        const history = [];
        let historyIndex = -1;

        window.addEventListener('DOMContentLoaded', () => {
            const wrapper = document.getElementById('canvasWrapper');
            canvas = new fabric.Canvas('c', {
                width: wrapper.clientWidth,
                height: wrapper.clientHeight,
                selection: true
            });

            window.addEventListener('resize', () => {
                canvas.setWidth(wrapper.clientWidth);
                canvas.setHeight(wrapper.clientHeight);
                canvas.renderAll();
            });

            initCanvasEvents();
            saveState();
        });

        document.getElementById('btnToggleSidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
        });

        function toggleAccordion(id) {
            document.getElementById(id).classList.toggle('show');
        }

        function updateFloatingMenu() {
            const floatingGroup = document.getElementById('floatingActionGroup');
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                const bound = activeObj.getBoundingRect();
                floatingGroup.style.display = 'flex';
                floatingGroup.style.left = `${bound.left + bound.width / 2}px`;
                floatingGroup.style.top = `${bound.top - 10}px`;
            } else {
                floatingGroup.style.display = 'none';
            }
        }

        function initCanvasEvents() {
            canvas.on('selection:created', updateFloatingMenu);
            canvas.on('selection:updated', updateFloatingMenu);
            canvas.on('selection:cleared', () => {
                document.getElementById('floatingActionGroup').style.display = 'none';
            });
            canvas.on('object:modified', saveState);
        }

        /* إضافة نص للمقاسات */
        function addTextDimension() {
            const text = new fabric.IText('المسافة = 00 سم', {
                left: canvas.width / 2 - 50,
                top: canvas.height / 2,
                fontSize: 14,
                fill: '#00f2fe',
                fontWeight: 'bold',
                backgroundColor: 'rgba(0,0,0,0.6)'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
            saveState();
        }

        document.getElementById('btnAddText').addEventListener('click', addTextDimension);

        /* إدارة الغرف */
        function openRoomModal(type) {
            document.getElementById('roomInputModal').style.display = 'flex';
        }

        function closeRoomModal() {
            document.getElementById('roomInputModal').style.display = 'none';
        }

        function confirmAddRoom() {
            const l = parseFloat(document.getElementById('inputRoomLength').value) || 4.0;
            const w = parseFloat(document.getElementById('inputRoomWidth').value) || 3.0;

            const rect = new fabric.Rect({
                width: w * 40, height: l * 40,
                fill: 'rgba(0, 242, 254, 0.05)',
                stroke: '#00f2fe', strokeWidth: 2
            });

            const text = new fabric.Text(`غرفة (${l}m × ${w}m)`, {
                fontSize: 12, fill: '#fff', originX: 'center', originY: 'center',
                left: (w * 40) / 2, top: (l * 40) / 2
            });

            const group = new fabric.Group([rect, text], {
                left: canvas.width / 2 - 50, top: canvas.height / 2 - 50
            });

            canvas.add(group);
            closeRoomModal();
            saveState();
        }

        /* إضافة رموز */
        function addSymbol(type, label) {
            const symbol = new fabric.Circle({
                radius: 10, fill: type === 'socket' ? '#00f2fe' : '#ffb703', stroke: '#fff', strokeWidth: 1.5
            });
            const text = new fabric.Text(label, { fontSize: 10, fill: '#fff', top: 15, originX: 'center', left: 10 });

            const group = new fabric.Group([symbol, text], { left: canvas.width / 2, top: canvas.height / 2 });
            canvas.add(group);
            saveState();
        }

        /* الحذف والتكرار */
        document.getElementById('floatingDeleteBtn').addEventListener('click', () => {
            const active = canvas.getActiveObject();
            if (active) { canvas.remove(active); canvas.discardActiveObject(); saveState(); }
        });

        document.getElementById('floatingDuplicateBtn').addEventListener('click', () => {
            const active = canvas.getActiveObject();
            if (active) {
                active.clone((cloned) => {
                    cloned.set({ left: active.left + 15, top: active.top + 15 });
                    canvas.add(cloned);
                    saveState();
                });
            }
        });

        /* السجل (Undo/Redo) */
        function saveState() {
            if (historyIndex < history.length - 1) history.splice(historyIndex + 1);
            history.push(JSON.stringify(canvas.toJSON()));
            historyIndex++;
            document.getElementById('btnUndo').disabled = historyIndex <= 0;
            document.getElementById('btnRedo').disabled = historyIndex >= history.length - 1;
        }

        document.getElementById('btnUndo').addEventListener('click', () => {
            if (historyIndex > 0) {
                historyIndex--;
                canvas.loadFromJSON(history[historyIndex], () => canvas.renderAll());
            }
        });

        document.getElementById('btnRedo').addEventListener('click', () => {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                canvas.loadFromJSON(history[historyIndex], () => canvas.renderAll());
            }
        });

        /* الحفظ */
        document.getElementById('btnSave').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'SNelectric-Plan.png';
            link.href = canvas.toDataURL({ format: 'png', multiplier: 2 });
            link.click();
        });

        function clearCanvas() {
            if (confirm('مسح اللوحة بالكامل؟')) { canvas.clear(); saveState(); }
        }
    </script>
</body>
</html>
