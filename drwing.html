<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S⚡N - مخطط الغرف والأثاث ثلاثي الأبعاد</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --warning-color: #ef4444;
            --header-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* App Header */
        header {
            height: var(--header-height);
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            background: linear-gradient(45deg, #3b82f6, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            background: var(--accent-color);
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Room Dimensions Form */
        .room-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
        }

        .room-inputs input {
            width: 50px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--accent-color);
            color: #fff;
            text-align: center;
            font-size: 0.85rem;
            outline: none;
        }

        .room-inputs label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Main Container */
        .main-container {
            display: flex;
            height: calc(100vh - var(--header-height));
            margin-top: var(--header-height);
            position: relative;
        }

        /* Canvas Viewport */
        #viewport {
            flex-grow: 1;
            height: 100%;
            position: relative;
            background-color: #050811;
        }

        /* Sidebar Library */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid var(--panel-border);
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .library-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .accordion-item {
            margin-bottom: 8px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.1);
        }

        .accordion-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .accordion-content {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }

        .accordion-item.open .accordion-content {
            max-height: 500px;
            padding: 10px;
        }

        .accordion-item.open .arrow {
            transform: rotate(90deg);
        }

        .arrow {
            transition: transform 0.2s;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .item-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .item-card:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .item-icon {
            font-size: 1.8rem;
        }

        .item-title {
            font-size: 0.75rem;
            color: var(--text-color);
        }

        /* Floating Bottom Toolbar */
        .floating-toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 20;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 1px solid var(--panel-border);
            padding-left: 12px;
        }

        .toolbar-group:last-child {
            border-left: none;
            padding-left: 0;
        }

        .color-picker-wrapper {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #fff;
            cursor: pointer;
            position: relative;
        }

        .color-picker-wrapper input[type="color"] {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            border: none;
        }

        /* Warnings & Notifications */
        #warning-toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--warning-color);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #warning-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* FPS Overlay UI */
        #fps-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            display: none;
            color: white;
            font-size: 0.8rem;
            z-index: 15;
            pointer-events: none;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
            }
            .room-inputs input {
                width: 35px;
            }
        }
    </style>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Notification Warning -->
    <div id="warning-toast">
        ⚠️ تنبيه: أبعاد العنصر أكبر من مساحة الجدار/الغرفة!
    </div>

    <!-- Application Header -->
    <header>
        <div class="logo">
            S⚡N <span>Architect 3D</span>
        </div>

        <div class="room-inputs">
            <label>الطول (م):</label>
            <input type="number" id="room-length" value="6" min="2" max="20" step="0.5">
            <label>العرض (م):</label>
            <input type="number" id="room-width" value="5" min="2" max="20" step="0.5">
            <label>الارتفاع (م):</label>
            <input type="number" id="room-height" value="3" min="2" max="6" step="0.1">
            <button class="btn btn-primary" onclick="updateRoomDimensions()">تطبيق</button>
        </div>

        <div class="header-controls">
            <button class="btn active" id="btn-top-view" onclick="setViewMode('top')">منظور علوي (Top)</button>
            <button class="btn" id="btn-iso-view" onclick="setViewMode('iso')">منظور إيزومتري</button>
            <button class="btn" id="btn-fps-view" onclick="setViewMode('fps')">تجول داخلي (FPS)</button>
            <button class="btn" onclick="clearScene()">مسح الكل</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="main-container">
        
        <!-- Viewport Three.js Canvas -->
        <div id="viewport">
            <div id="fps-controls">
                استخدم أسهم الكيبورد أو (W, A, S, D) للتحرك | حرك الماوس للنظر حولك
            </div>
        </div>

        <!-- Sidebar Library -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="بحث عن عنصر (مثل: سرير، مفتاح، باب)..." oninput="filterLibrary()">
            </div>
            
            <div class="library-content" id="library-container">
                <!-- Categories will be rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- Floating Bottom Controls Toolbar -->
    <div class="floating-toolbar">
        <div class="toolbar-group">
            <span style="font-size: 0.8rem; color: var(--text-muted);">لون العنصر:</span>
            <div class="color-picker-wrapper">
                <input type="color" id="element-color" value="#3b82f6" onchange="updateSelectedObjectColor(this.value)">
            </div>
        </div>

        <div class="toolbar-group">
            <span style="font-size: 0.8rem; color: var(--text-muted);">سمك الرسم:</span>
            <input type="range" id="pen-thickness" min="1" max="10" value="3" style="width: 80px;">
        </div>

        <div class="toolbar-group">
            <button class="btn" onclick="rotateSelectedObject()">🔄 تدوير</button>
            <button class="btn" style="color: var(--warning-color);" onclick="deleteSelectedObject()">🗑️ حذف</button>
        </div>
    </div>

    <script>
        // --- Library Data Structure ---
        const libraryData = [
            {
                category: "الأثاث الأساسي",
                items: [
                    { id: "bed", name: "سرير مزدوج", icon: "🛏️", size: [2, 0.8, 2] },
                    { id: "sofa", name: "اريكة معيشة", icon: "🛋️", size: [2.2, 0.9, 0.9] },
                    { id: "table", name: "طاولة طعام", icon: "🪑", size: [1.6, 0.75, 0.9] },
                    { id: "wardrobe", name: "خزانة ملابس", icon: "🚪", size: [1.8, 2.2, 0.6] }
                ]
            },
            {
                category: "التجهيزات الكهربائية",
                items: [
                    { id: "switch", name: "مفتاح كهربائي", icon: "🔘", size: [0.15, 0.15, 0.05], wallMounted: true },
                    { id: "socket", name: "مقبس كهرباء", icon: "🔌", size: [0.15, 0.15, 0.05], wallMounted: true },
                    { id: "lamp", name: "مصباح أرضي", icon: "💡", size: [0.4, 1.7, 0.4] }
                ]
            },
            {
                category: "الفتحات المعمارية",
                items: [
                    { id: "door", name: "باب خشب", icon: "🚪", size: [1, 2.1, 0.15], wallMounted: true },
                    { id: "window", name: "نافذة زجاجية", icon: "🪟", size: [1.2, 1.2, 0.15], wallMounted: true }
                ]
            }
        ];

        // --- Core Variables ---
        let scene, camera, renderer, controls;
        let roomGroup, objectsGroup;
        let roomDimensions = { length: 6, width: 5, height: 3, wallThickness: 0.15 };
        let selectedObject = null;
        let viewMode = 'top'; // 'top', 'iso', 'fps'
        
        // FPS Movement Controls Variables
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let clock = new THREE.Clock();

        // --- Initialization ---
        function init() {
            const container = document.getElementById('viewport');

            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(10, 20, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Groups
            roomGroup = new THREE.Group();
            objectsGroup = new THREE.Group();
            scene.add(roomGroup);
            scene.add(objectsGroup);

            // Initialize Scene Content
            buildRoom();
            renderLibraryUI();
            setViewMode('top');

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupRaycaster();
            setupFPSControls();

            // Animation Loop
            animate();
        }

        // --- Room Construction (3D Architectural Fixes) ---
        function buildRoom() {
            // Clear existing room
            while (roomGroup.children.length > 0) {
                const obj = roomGroup.children[0];
                roomGroup.remove(obj);
            }

            const L = parseFloat(roomDimensions.length);
            const W = parseFloat(roomDimensions.width);
            const H = parseFloat(roomDimensions.height);
            const T = parseFloat(roomDimensions.wallThickness); // Fixed 15cm (0.15m)

            // Floor
            const floorGeo = new THREE.BoxGeometry(L, 0.01, W);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.005;
            floor.receiveShadow = true;
            roomGroup.add(floor);

            // Grid Floor Overlay
            const grid = new THREE.GridHelper(Math.max(L, W) * 2, Math.max(L, W) * 2, 0x3b82f6, 0x1e293b);
            grid.position.y = 0.01;
            roomGroup.add(grid);

            // Wall Material
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0x334155, 
                transparent: true, 
                opacity: 0.7, 
                roughness: 0.5 
            });

            // Building Walls with Exact 15cm Thickness
            // Back Wall
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(L + (2 * T), H, T), wallMat);
            backWall.position.set(0, H / 2, -W / 2 - T / 2);
            backWall.castShadow = true;
            roomGroup.add(backWall);

            // Front Wall
            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(L + (2 * T), H, T), wallMat);
            frontWall.position.set(0, H / 2, W / 2 + T / 2);
            frontWall.castShadow = true;
            roomGroup.add(frontWall);

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(T, H, W), wallMat);
            leftWall.position.set(-L / 2 - T / 2, H / 2, 0);
            leftWall.castShadow = true;
            roomGroup.add(leftWall);

            // Right Wall
            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(T, H, W), wallMat);
            rightWall.position.set(L / 2 + T / 2, H / 2, 0);
            rightWall.castShadow = true;
            roomGroup.add(rightWall);
        }

        function updateRoomDimensions() {
            roomDimensions.length = parseFloat(document.getElementById('room-length').value) || 6;
            roomDimensions.width = parseFloat(document.getElementById('room-width').value) || 5;
            roomDimensions.height = parseFloat(document.getElementById('room-height').value) || 3;
            
            buildRoom();
            
            // Re-validate existing furniture inside updated room dimensions
            objectsGroup.children.forEach(obj => checkCollisionAndFit(obj));
        }

        // --- Camera & View Modes ---
        function setViewMode(mode) {
            viewMode = mode;
            document.querySelectorAll('.header-controls .btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}-view`).classList.add('active');

            const L = roomDimensions.length;
            const W = roomDimensions.width;
            const H = roomDimensions.height;
            const maxDim = Math.max(L, W);

            const fpsOverlay = document.getElementById('fps-controls');
            fpsOverlay.style.display = (mode === 'fps') ? 'block' : 'none';

            if (mode === 'top') {
                // Architectural Top/Isometric View default
                camera.position.set(0, maxDim * 1.8, 0.001);
                controls.target.set(0, 0, 0);
                controls.enableRotate = false;
            } else if (mode === 'iso') {
                camera.position.set(maxDim * 1.2, H * 2.5, maxDim * 1.2);
                controls.target.set(0, 0, 0);
                controls.enableRotate = true;
            } else if (mode === 'fps') {
                camera.position.set(0, 1.6, 0); // Eye height level
                controls.target.set(0, 1.6, -1);
                controls.enableRotate = true;
            }
            controls.update();
        }

        // --- Library UI & Collapsible Logic ---
        function renderLibraryUI(filterText = "") {
            const container = document.getElementById('library-container');
            container.innerHTML = "";

            libraryData.forEach((cat, index) => {
                const filteredItems = cat.items.filter(item => item.name.includes(filterText));
                
                if (filteredItems.length === 0 && filterText !== "") return;

                const itemEl = document.createElement('div');
                itemEl.className = `accordion-item ${filterText !== "" || index === 0 ? 'open' : ''}`;

                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `
                    <span>${cat.category}</span>
                    <span class="arrow">►</span>
                `;
                header.onclick = () => itemEl.classList.toggle('open');

                const content = document.createElement('div');
                content.className = 'accordion-content';

                filteredItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.onclick = () => spawnElement(item);
                    card.innerHTML = `
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-title">${item.name}</div>
                    `;
                    content.appendChild(card);
                });

                itemEl.appendChild(header);
                itemEl.appendChild(content);
                container.appendChild(itemEl);
            });
        }

        function filterLibrary() {
            const query = document.getElementById('search-input').value.trim();
            renderLibraryUI(query);
        }

        // --- Element Spawning & Collision Detection ---
        function spawnElement(itemData) {
            const [sx, sy, sz] = itemData.size;
            const geo = new THREE.BoxGeometry(sx, sy, sz);
            const defaultColor = document.getElementById('element-color').value;
            const mat = new THREE.MeshStandardMaterial({ color: defaultColor, roughness: 0.3 });
            
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Set initial Y position based on object dimensions
            mesh.position.set(0, sy / 2, 0);
            
            // Attach Custom Metadata
            mesh.userData = { 
                id: itemData.id, 
                name: itemData.name, 
                size: itemData.size,
                wallMounted: itemData.wallMounted || false 
            };

            // Outer Bounding Box visual helper
            const wireGeo = new THREE.WireframeGeometry(geo);
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
            const wireframe = new THREE.LineSegments(wireGeo, wireMat);
            wireframe.name = "wireframe";
            mesh.add(wireframe);

            objectsGroup.add(mesh);
            selectObject(mesh);

            // Execute Warning Check Immediately
            checkCollisionAndFit(mesh);
        }

        // --- Intelligent Collision & Fit Warning ---
        function checkCollisionAndFit(mesh) {
            const [sx, sy, sz] = mesh.userData.size;
            const L = roomDimensions.length;
            const W = roomDimensions.width;
            const H = roomDimensions.height;

            // Scale factor if scaled dynamically
            const boundsX = sx * mesh.scale.x;
            const boundsY = sy * mesh.scale.y;
            const boundsZ = sz * mesh.scale.z;

            // Condition checking if object exceeds room or wall height limits
            const isTooLarge = boundsX > L || boundsZ > W || boundsY > H;
            
            if (isTooLarge) {
                showWarningToast(`⚠️ تنبيه: أبعاد العنصر (${mesh.userData.name}) أكبر من مساحة الجدار/الغرفة!`);
                mesh.material.color.setHex(0xef4444); // Color Red on Warning
            } else if (selectedObject === mesh) {
                mesh.material.color.setStyle(document.getElementById('element-color').value);
            }
        }

        function showWarningToast(msg) {
            const toast = document.getElementById('warning-toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // --- Interaction & Selection Handling ---
        function setupRaycaster() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            window.addEventListener('pointerdown', (e) => {
                // Avoid UI Triggering
                if (e.target.tagName !== 'CANVAS') return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / (window.innerHeight - 60)) * 2 + 1; // Subtract Header height

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(objectsGroup.children, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && obj.parent !== objectsGroup) {
                        obj = obj.parent;
                    }
                    selectObject(obj);
                }
            });
        }

        function selectObject(obj) {
            if (selectedObject && selectedObject.userData) {
                // Reset wireframe color
                const prevWire = selectedObject.getObjectByName("wireframe");
                if (prevWire) prevWire.material.color.setHex(0xffffff);
            }

            selectedObject = obj;
            if (selectedObject) {
                const wire = selectedObject.getObjectByName("wireframe");
                if (wire) wire.material.color.setHex(0x3b82f6);
                document.getElementById('element-color').value = '#' + selectedObject.material.color.getHexString();
            }
        }

        function updateSelectedObjectColor(hexColor) {
            if (selectedObject) {
                selectedObject.material.color.setStyle(hexColor);
            }
        }

        function rotateSelectedObject() {
            if (selectedObject) {
                selectedObject.rotation.y += Math.PI / 2;
                checkCollisionAndFit(selectedObject);
            }
        }

        function deleteSelectedObject() {
            if (selectedObject) {
                objectsGroup.remove(selectedObject);
                selectedObject = null;
            }
        }

        function clearScene() {
            while (objectsGroup.children.length > 0) {
                objectsGroup.remove(objectsGroup.children[0]);
            }
            selectedObject = null;
        }

        // --- First Person Controls (WASD) ---
        function setupFPSControls() {
            const onKeyDown = (event) => {
                if (viewMode !== 'fps') return;
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = (event) => {
                if (viewMode !== 'fps') return;
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                }
            };

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
        }

        function updateFPSMovement(delta) {
            if (viewMode !== 'fps') return;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

            controls.moveForward(-velocity.z * delta);
            controls.moveRight(-velocity.x * delta);
        }

        // --- Window Resizing ---
        function onWindowResize() {
            const container = document.getElementById('viewport');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // --- Main Render Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (viewMode === 'fps') {
                updateFPSMovement(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Run On Load
        window.onload = init;
    </script>
</body>
</html>
