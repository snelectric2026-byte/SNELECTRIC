<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابي الشخصي - SN ELECTRIC</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap">
    <style>
        body { background: #071120; color: #fff; font-family: 'Cairo', sans-serif; padding-bottom: 90px; }
        
        /* الفريم العصري بحدود حمراء تنقلب أخضر عند النجاح */
        .auth-container { 
            max-width: 420px; margin: 50px auto; background: #0d1a30; 
            border: 2px solid #e74c3c; border-radius: 16px; padding: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: border-color 0.4s ease, box-shadow 0.4s ease; 
        }
        .auth-container.success-mode { 
            border-color: #2ecc71; 
            box-shadow: 0 0 20px rgba(46,204,113,0.3);
        }
        
        .auth-title { text-align: center; color: var(--accent); margin-bottom: 20px; font-size: 22px; font-weight: 800; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; background: #071120; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 15px; }
        .btn-action { width: 100%; padding: 12px; background: var(--accent); color: var(--dark); border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 1[...]
        .toggle-link { text-align: center; margin-top: 15px; font-size: 13px; color: #a0aec0; cursor: pointer; text-decoration: underline; }
        .project-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 18px; margin-bottom: 15px; border-right: 4px solid var(--accent);[...]
    </style>
</head>
<body>

    <header style="padding: 15px; background: #081a33; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center;">
        <h2 style="color: var(--accent); font-size: 18px;"><i class="fa-solid fa-user-shield"></i> لوحة متابعة العملاء</h2>
    </header>

    <div class="container" style="padding-top: 20px;">
        
        <!-- نموذج الدخول ونسيت كلمة المرور (إطار أحمر نشط) -->
        <div id="authBox" class="auth-container">
            <div id="loginView">
                <div class="auth-title">تسجيل الدخول لمتابعة طلباتك</div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="loginPhone" placeholder="أدخل رقم هاتفك المسجل">
                </div>
                <div class="form-group">
                    <label>الرقم السري</label>
                    <input type="password" id="loginPassword" placeholder="أدخل الرقم السري">
                </div>
                <button class="btn-action" onclick="clientLogin()">دخول</button>
                <div class="toggle-link" onclick="switchView('forgot')">نسيت كلمة المرور؟</div>
            </div>

            <div id="forgotView" style="display: none;">
                <div class="auth-title" style="color: #e74c3c;">استعادة كلمة المرور</div>
                <div class="form-group">
                    <label>رقم الهاتف المرتبط بحسابك</label>
                    <input type="tel" id="forgotPhone" placeholder="أدخل رقم هاتفك">
                </div>
                <div class="form-group">
                    <label>الرقم السري الجديد</label>
                    <input type="password" id="newPassword" placeholder="أدخل الرقم السري الجديد">
                </div>
                <div class="form-group">
                    <label>تأكيد الرقم السري الجديد</label>
                    <input type="password" id="confirmNewPassword" placeholder="أعد إدخال الرقم السري">
                </div>
                <button class="btn-action" style="background: #e74c3c; color: #fff;" onclick="resetPassword()">تحديث كلمة المرور</button>
                <div class="toggle-link" onclick="switchView('login')">العودة لتسجيل الدخول</div>
            </div>
        </div>

        <!-- لوحة عرض الطلبات بعد التحقق الناجح -->
        <div id="dashboardBox" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(46,204,113,0.1); border: 1px solid #2ecc71; padding: 15px; border-radius: 12px; margin-[...]
                <div>
                    <h3 id="clientWelcomeName" style="color: #2ecc71; margin: 0; font-size: 18px;">مرحباً بك</h3>
                    <p id="clientWelcomePhone" style="margin: 5px 0 0 0; font-size: 13px; color: #a0aec0;"></p>
                </div>
                <button onclick="clientLogout()" style="background: #e74c3c; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">تسجيل خروج</button>
            </div>

            <h3 style="margin-bottom: 15px; border-bottom: 2px solid var(--accent); padding-bottom: 8px;">مشاريعك وطلباتك السابقة:</h3>
            <div id="clientProjectsList">
                <p style="text-align: center; color: #a0aec0;">جاري تحميل مشاريعك...</p>
            </div>
        </div>

    </div>

    <nav class="sn-bottom-nav">
        <a href="profile.html" class="sn-nav-item active"><span>👤</span><span>حسابي</span></a>
        <a href="contract.html" class="sn-nav-item"><span>📄</span><span>عقد</span></a>
        <a href="index.html" class="sn-nav-item"><span>🏠</span><span>رئيسية</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase.js"></script>
    <script>
        function switchView(view) {
            const authBox = document.getElementById('authBox');
            authBox.classList.remove('success-mode');
            if(view === 'forgot') {
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('forgotView').style.display = 'block';
            } else {
                document.getElementById('loginView').style.display = 'block';
                document.getElementById('forgotView').style.display = 'none';
            }
        }

        // فحص الجلسة المخزنة مسبقاً (دخول تلقائي إذا لم يسجل خروج)
        document.addEventListener("DOMContentLoaded", async function() {
            const savedPhone = localStorage.getItem("sn_client_phone");
            if (savedPhone) {
                document.getElementById('loginPhone').value = savedPhone;
                fetchClientData(savedPhone);
            }
        });

        async function clientLogin() {
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if(!phone || !password) {
                alert("الرجاء إدخال رقم الهاتف والرقم السري.");
                return;
            }

            const { data, error } = await supabase.from('customers').select('*').eq('phone', phone).single();

            if (error || !data) {
                alert("رقم الهاتف غير مسجل أو بيانات الدخول غير صحيحة.");
                return;
            }

            if (data.password && data.password !== password) {
                alert("الرقم السري غير صحيح.");
                return;
            }

            // حفظ بيانات الجلسة وتحويل الإطار إلى اللون الأخضر دليلاً على النجاح
            localStorage.setItem("sn_client_phone", phone);
            localStorage.setItem("sn_client_pin", password);
            
            const authBox = document.getElementById('authBox');
            authBox.classList.add('success-mode');
            
            setTimeout(() => {
                fetchClientData(phone);
            }, 500);
        }

        async function resetPassword() {
            const phone = document.getElementById('forgotPhone').value.trim();
            const newPass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmNewPassword').value.trim();

            if (!phone || !newPass || !confirmPass) {
                alert("الرجاء إكمال جميع الحقول.");
                return;
            }

            if (newPass !== confirmPass) {
                alert("كلمتا المرور غير متطابقتين!");
                return;
            }

            // تحديث الرقم السري في Supabase
            const { error } = await supabase.from('customers').update({ password: newPass }).eq('phone', phone);

            if (error) {
                alert("حدث خطأ أثناء التحديث: " + error.message);
                return;
            }

            // تحويل الإطار إلى الأخضر دليلاً على نجاح عملية الاستعادة
            const authBox = document.getElementById('authBox');
            authBox.classList.add('success-mode');
            
            alert("تم تحديث الرقم السري بنجاح!");
            document.getElementById('loginPhone').value = phone;
            setTimeout(() => { switchView('login'); }, 600);
        }

        async function fetchClientData(phone) {
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('dashboardBox').style.display = 'block';

            const { data: custData } = await supabase.from('customers').select('name').eq('phone', phone).single();
            if(custData) {
                document.getElementById('clientWelcomeName').textContent = "مرحباً، " + custData.name;
            }
            document.getElementById('clientWelcomePhone').textContent = "رقم الهاتف: " + phone;

            const { data: reqs, error } = await supabase.from('service_requests').select('*').eq('phone', phone).order('created_at', { ascending: false });

            const listContainer = document.getElementById('clientProjectsList');
            if (error || !reqs || reqs.length === 0) {
                listContainer.innerHTML = `<p style="text-align: center; color: #a0aec0; padding: 20px;">لا توجد طلبات مسجلة لهذا الرقم حتى الآن.</p>`;
                return;
            }

            let html = '';
            reqs.forEach(req => {
                html += `
                    <div class="project-card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <strong style="color: var(--accent);">${req.service_type || 'خدمة عامة'}</strong>
                            <span style="background: rgba(255,215,0,0.15); color: #ffd700; padding: 2px 8px; border-radius: 6px; font-size: 12px;">${req.status || 'قيد المعالجة'}</span[...]
                        </div>
                        <p style="margin: 4px 0; font-size: 14px;"><i class="fa-solid fa-location-dot"></i> العنوان: ${req.address || 'غير محدد'}</p>
                        <p style="margin: 4px 0; font-size: 14px;"><i class="fa-solid fa-money-bill"></i> التكلفة: ${req.total_price || 'حسب المعاينة'}</p>
                        <p style="margin: 4px 0; font-size: 12px; color: #8a9bb8;"><i class="fa-regular fa-clock"></i> التاريخ: ${new Date(req.created_at).toLocaleString('ar-EG')}</p>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function clientLogout() {
            localStorage.removeItem("sn_client_phone");
            localStorage.removeItem("sn_client_pin");
            location.reload();
        }
    </script>
</body>
</html>
