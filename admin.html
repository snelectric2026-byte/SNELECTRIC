<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e3a8a">
    <title>SN ELECTRIC - لوحة التحكم الإدارية</title>
    
    <!-- Link CSS Relative Path -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap">
    
    <style>
        body { background: #07101d; color: #fff; font-family: 'Cairo', sans-serif; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: #0b172a; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card h3 { color: #f1c40f; font-size: 24px; margin-top: 5px; }
        
        .requests-table-container { background: #0b172a; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 20px; margin-bottom: 25px; }
        .admin-vertical-list { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .admin-request-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 15px 20px; display: flex; flex-direction: column; gap: 10px; }
        .admin-card-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; }
        .status-pending { background: rgba(241, 196, 15, 0.2); color: #f1c40f; border: 1px solid #f1c40f; }
        .status-approved { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .status-rejected { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        
        .action-btns button, .action-btns a { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 5px; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-approve { background: #2ecc71; color: #fff; }
        .btn-reject { background: #e74c3c; color: #fff; }
        .btn-chat { background: #f1c40f; color: #07101d; }
        .btn-edit-pass { background: #3498db; color: #fff; }
        .btn-video { background: #9b59b6; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-header">
            <div>
                <h2><i class="fa-solid fa-user-shield"></i> لوحة تحكم الإدارة - SN ELECTRIC</h2>
            </div>
            <div>
                <a href="index.html" style="background: #1e3a8a; color: #fff; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-weight: bold;"><i class="fa-solid fa-home"></i> الرئيسية</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><p>إجمالي الطلبات</p><h3 id="statTotal">0</h3></div>
            <div class="stat-card"><p>قيد الانتظار</p><h3 id="statPending" style="color: #f1c40f;">0</h3></div>
            <div class="stat-card"><p>تم الموافقة</p><h3 id="statApproved" style="color: #2ecc71;">0</h3></div>
            <div class="stat-card"><p>العملاء المسجلين</p><h3 id="statClients" style="color: #3498db;">0</h3></div>
        </div>

        <div class="requests-table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #f1c40f; margin:0;"><i class="fa-solid fa-list-check"></i> سجل طلبات العملاء والخدمات</h3>
                <button onclick="loadAdminRequests()" style="background: #f1c40f; color: #07101d; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">تحديث الطلبات</button>
            </div>
            <div id="adminVerticalList" class="admin-vertical-list">
                <div style="text-align: center; padding: 20px;">جاري الجلب...</div>
            </div>
        </div>

        <div class="requests-table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #3498db; margin:0;"><i class="fa-solid fa-users-gear"></i> سجل حسابات العملاء المسجلين</h3>
                <button onclick="loadAdminCustomerRecords()" style="background: #3498db; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">تحديث جدول العملاء</button>
            </div>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: right; color: #fff; font-size: 14px;">
                    <thead>
                        <tr style="background: rgba(255,215,0,0.1); color: #f1c40f;">
                            <th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">اسم العميل</th>
                            <th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">رقم الهاتف</th>
                            <th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">كلمة السر</th>
                            <th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">تاريخ التسجيل</th>
                            <th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminCustomersTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 20px; color: #8a9bb8;">جاري الجلب...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts Arrangement -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script>
        // توحيد مرجع الاتصال بـ Supabase
        const dbClient = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);

        document.addEventListener('DOMContentLoaded', () => {
            loadAdminRequests();
            loadAdminCustomerRecords();
        });

        // 1. جلب طلبات الخدمات كاملة
        async function loadAdminRequests() {
            const container = document.getElementById('adminVerticalList');
            if (!dbClient) {
                if (container) container.innerHTML = `<div style="text-align: center; color: #e74c3c; padding: 20px;">خطأ: اتصال Supabase غير متوفر</div>`;
                return;
            }

            try {
                const { data, error } = await dbClient
                    .from('service_requests')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data) {
                    renderRequestsVerticalList(data);
                    updateStats(data);
                }
            } catch (err) {
                console.error("Fetch requests error:", err);
                if (container) container.innerHTML = `<div style="text-align: center; color: #e74c3c; padding: 20px;">خطأ أثناء جلب الطلبات: ${err.message || err}</div>`;
            }
        }

        // 2. عرض كروت الطلبات بالتفاصيل الكاملة (الاسم، الهاتف، الخدمة، العنوان، التاريخ)
        function renderRequestsVerticalList(requests) {
            const container = document.getElementById('adminVerticalList');
            if (!container) return;
            if (requests.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 20px; color: #aaa;">لا توجد طلبات مسجلة حتى الآن</div>`;
                return;
            }

            container.innerHTML = '';
            requests.forEach((req, index) => {
                let statusClass = req.status === 'موافقة' ? 'status-approved' : (req.status === 'مرفوض' ? 'status-rejected' : 'status-pending');
                let projectCode = req.id ? `SN-${req.id}` : `SN-${index+1}`;
                let phone = req.customer_phone || req.phone_number || req.phone || 'غير مسجل';
                let address = req.address || 'غير محدد';
                let dateStr = req.created_at ? new Date(req.created_at).toLocaleString('ar-EG') : 'حديث';

                let card = document.createElement('div');
                card.className = 'admin-request-card';
                card.innerHTML = `
                    <div class="admin-card-row">
                        <span><strong># ${index + 1} | كود المشروع:</strong> <span style="color:#f1c40f;">${projectCode}</span></span>
                        <span class="status-badge ${statusClass}">${req.status || 'قيد الانتظار'}</span>
                    </div>
                    <div class="admin-card-row">
                        <span><strong>العميل:</strong> ${req.customer_name || 'غير متوفر'}</span>
                        <span><strong>الهاتف:</strong> <a href="tel:${phone}" style="color:#f1c40f; text-decoration:none;">${phone}</a></span>
                        <span><strong>الخدمة:</strong> ${req.service_type || req.service_name || 'طلب عام'}</span>
                    </div>
                    <div class="admin-card-row">
                        <span><strong>العنوان بالتفصيل:</strong> ${address}</span>
                        <span><strong>التاريخ والوقت:</strong> <span style="color:#8a9bb8; font-size:12px;">${dateStr}</span></span>
                    </div>
                    <div class="admin-card-row" style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; justify-content: flex-end;">
                        <div class="action-btns">
                            <button class="btn-approve" onclick="updateStatus(${req.id}, 'موافقة')"><i class="fa-solid fa-check"></i> موافقة</button>
                            <button class="btn-reject" onclick="updateStatus(${req.id}, 'مرفوض')"><i class="fa-solid fa-xmark"></i> رفض</button>
                            <button class="btn-video" onclick="startAdminVideoCall('${phone}')"><i class="fa-solid fa-video"></i> فيديو</button>
                            <a href="https://wa.me/2${phone}" target="_blank" class="btn-chat"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. تحديث حالة الطلب
        async function updateStatus(id, status) {
            if (!id) return;
            const { error } = await dbClient.from('service_requests').update({ status: status }).eq('id', id);
            if (!error) {
                loadAdminRequests();
            } else {
                alert("تعذر تحديث الحالة: " + error.message);
            }
        }

        // 4. تحديث الإحصائيات
        function updateStats(requests) {
            document.getElementById('statTotal').innerText = requests.length;
            document.getElementById('statPending').innerText = requests.filter(r => !r.status || r.status === 'pending' || r.status === 'قيد الانتظار').length;
            document.getElementById('statApproved').innerText = requests.filter(r => r.status === 'موافقة').length;
        }

        // 5. جلب جدول حسابات العملاء المسجلين
        async function loadAdminCustomerRecords() {
            const tbody = document.getElementById('adminCustomersTableBody');
            if (!dbClient) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #e74c3c; padding: 15px;">خطأ: اتصال Supabase غير متوفر</td></tr>`;
                return;
            }

            try {
                const { data, error } = await dbClient
                    .from('customers')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error || !data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 15px; color: #aaa;">لا توجد حسابات مسجلة في جدول العملاء</td></tr>`;
                    if(data) document.getElementById('statClients').innerText = data.length;
                    return;
                }

                document.getElementById('statClients').innerText = data.length;
                tbody.innerHTML = '';
                data.forEach(client => {
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid rgba(255,255,255,0.06)';
                    
                    const clientName = client.name || client.full_name || client.customer_name || 'غير محدد';
                    const clientPhone = client.phone || client.mobile || 'غير متوفر';
                    const clientPassword = client.password || client.pin_code || 'غير مسجل';
                    const clientDate = client.created_at ? new Date(client.created_at).toLocaleString('ar-EG') : 'حديث';

                    row.innerHTML = `
                        <td style="padding: 12px; font-weight: 600;">${clientName}</td>
                        <td style="padding: 12px; font-family: monospace; color: #79c0ff;">${clientPhone}</td>
                        <td style="padding: 12px; font-family: monospace; color: #f1c40f;">${clientPassword}</td>
                        <td style="padding: 12px; font-size: 12px; color: #8a9bb8;">${clientDate}</td>
                        <td style="padding: 12px;">
                            <button class="btn-edit-pass" onclick="changeClientPassword('${clientPhone}')" style="padding:4px 8px; font-size:11px;"><i class="fa-solid fa-key"></i> تعديل كلمة السر</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #e74c3c; padding: 15px;">حدث خطأ أثناء جلب حسابات العملاء</td></tr>`;
            }
        }

        function startAdminVideoCall(phone) {
            let msg = `مرحباً بك من إدارة SN ELECTRIC، نبدأ الآن مكالمة فيديو معاينة مباشرة للموقع.`;
            window.open(`https://wa.me/2${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function changeClientPassword(phone) {
            let newPass = prompt(`أدخل كلمة المرور الجديدة للرقم (${phone}):`);
            if (!newPass) return;
            const { error } = await dbClient.from('customers').update({ password: newPass.trim() }).eq('phone', phone);
            if (!error) {
                alert('تم التحديث بنجاح');
                loadAdminCustomerRecords();
            } else {
                alert('حدث خطأ أثناء التحديث: ' + error.message);
            }
        }
    </script>
</body>
</html>
