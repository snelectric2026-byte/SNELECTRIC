<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e3a8a">
    <title>SN ELECTRIC - لوحة التحكم الإدارية</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap">
    <style>
        body { background: #07101d; color: #fff; font-family: 'Cairo', sans-serif; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: var(--dark); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card h3 { color: var(--accent); font-size: 24px; margin-top: 5px; }
        
        .requests-table-container { background: var(--dark); border-radius: 12px; border: 1px solid var(--border); padding: 20px; margin-bottom: 25px; }
        .admin-vertical-list { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .admin-request-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 15px 20px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .admin-card-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; }
        .status-pending { background: rgba(241, 196, 15, 0.2); color: #f1c40f; border: 1px solid #f1c40f; }
        .status-approved { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .status-rejected { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        
        .action-btns button, .action-btns a { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 5px; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-approve { background: #2ecc71; color: #fff; }
        .btn-reject { background: #e74c3c; color: #fff; }
        .btn-chat { background: var(--accent); color: var(--dark); }
        .btn-edit-pass { background: #3498db; color: #fff; }
        .btn-video { background: #9b59b6; color: #fff; }
        
        #notificationAlertBox { display: none; background: #e74c3c; color: #fff; padding: 15px; text-align: center; font-weight: bold; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-header">
            <div>
                <h2><i class="fa-solid fa-user-shield"></i> لوحة تحكم الإدارة - SN ELECTRIC</h2>
            </div>
            <div>
                <a href="index.html" style="background: #1e3a8a; color: #fff; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-weight: bold;"><i class="fa-solid fa-home"></i> الرئيسية</a>
            </div>
        </div>

        <div id="notificationAlertBox">
            <i class="fa-solid fa-triangle-exclamation"></i> تنبيه: طلب خدمة جديد!
        </div>

        <div class="stats-grid">
            <div class="stat-card"><p>إجمالي الطلبات</p><h3 id="statTotal">0</h3></div>
            <div class="stat-card"><p>قيد الانتظار</p><h3 id="statPending" style="color: #f1c40f;">0</h3></div>
            <div class="stat-card"><p>تم الموافقة</p><h3 id="statApproved" style="color: #2ecc71;">0</h3></div>
            <div class="stat-card"><p>العملاء المسجلين</p><h3 id="statClients" style="color: #3498db;">0</h3></div>
        </div>

        <div class="requests-table-container">
            <h3 style="margin-bottom: 15px; color: var(--accent);"><i class="fa-solid fa-list-check"></i> سجل طلبات العملاء والخدمات</h3>
            <div id="adminVerticalList" class="admin-vertical-list">
                <div style="text-align: center; padding: 20px;">جاري الجلب...</div>
            </div>
        </div>

        <div class="requests-table-container">
            <h3 style="margin-bottom: 15px; color: #3498db;"><i class="fa-solid fa-users-gear"></i> سجل حسابات العملاء وأرقام الهواتف</h3>
            <div id="adminClientsList" class="admin-vertical-list">
                <div style="text-align: center; padding: 20px;">جاري الجلب...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminRequests();
            loadAdminClients();
        });

        async function loadAdminRequests() {
            if (!window.supabaseClient) return;
            const { data } = await window.supabaseClient.from('service_requests').select('*').order('created_at', { ascending: false });
            if (data) {
                renderRequestsVerticalList(data);
                updateStats(data);
            }
        }

        async function loadAdminClients() {
            if (!window.supabaseClient) return;
            const { data } = await window.supabaseClient.from('clients').select('*').order('phone', { ascending: true });
            const container = document.getElementById('adminClientsList');
            if (document.getElementById('statClients') && data) document.getElementById('statClients').innerText = data.length;
            if (!container) return;

            if (!data || data.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 20px; color: #aaa;">لا توجد حسابات مسجلة</div>`;
                return;
            }

            container.innerHTML = '';
            data.forEach((client, index) => {
                let card = document.createElement('div');
                card.className = 'admin-request-card';
                card.innerHTML = `
                    <div class="admin-card-row">
                        <span><strong># ${index + 1} | الهاتف:</strong> <a href="tel:${client.phone}" style="color:var(--accent); text-decoration:none;">${client.phone}</a></span>
                        <span><strong>كلمة السر:</strong> <span style="background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 6px; font-family: monospace;">${client.password}</span></span>
                    </div>
                    <div class="admin-card-row" style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; justify-content: flex-end;">
                        <div class="action-btns">
                            <button class="btn-video" onclick="startAdminVideoCall('${client.phone}')"><i class="fa-solid fa-video"></i> مكالمة فيديو</button>
                            <button class="btn-edit-pass" onclick="changeClientPassword('${client.phone}')"><i class="fa-solid fa-key"></i> تعديل كلمة السر</button>
                            <a href="https://wa.me/2${client.phone}" target="_blank" class="btn-chat"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function startAdminVideoCall(phone) {
            let msg = `مرحباً بك من إدارة SN ELECTRIC، نبدأ الآن مكالمة فيديو معاينة مباشرة للموقع.`;
            window.open(`https://wa.me/2${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function changeClientPassword(phone) {
            let newPass = prompt(`أدخل كلمة المرور الجديدة للرقم (${phone}):`);
            if (!newPass) return;
            const { error } = await window.supabaseClient.from('clients').update({ password: newPass.trim() }).eq('phone', phone);
            if (!error) {
                alert('تم التحديث بنجاح');
                loadAdminClients();
            } else {
                alert('حدث خطأ');
            }
        }

        function renderRequestsVerticalList(requests) {
            const container = document.getElementById('adminVerticalList');
            if (!container) return;
            if (requests.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 20px; color: #aaa;">لا توجد طلبات</div>`;
                return;
            }

            container.innerHTML = '';
            requests.forEach((req, index) => {
                let statusClass = req.status === 'موافقة' ? 'status-approved' : (req.status === 'مرفوض' ? 'status-rejected' : 'status-pending');
                let projectCode = req.id ? `SN-${req.id}` : `SN-${index+1}`;

                let card = document.createElement('div');
                card.className = 'admin-request-card';
                card.innerHTML = `
                    <div class="admin-card-row">
                        <span><strong># ${index + 1} | كود المشروع:</strong> <span style="color:var(--accent);">${projectCode}</span></span>
                        <span class="status-badge ${statusClass}">${req.status || 'قيد الانتظار'}</span>
                    </div>
                    <div class="admin-card-row">
                        <span><strong>العميل:</strong> ${req.customer_name || 'غير متوفر'}</span>
                        <span><strong>الهاتف:</strong> ${req.customer_phone}</span>
                        <span><strong>الخدمة:</strong> ${req.service_name || req.service_type}</span>
                    </div>
                    <div class="admin-card-row" style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; justify-content: flex-end;">
                        <div class="action-btns">
                            <button class="btn-approve" onclick="updateStatus(${req.id}, 'موافقة')"><i class="fa-solid fa-check"></i> موافقة</button>
                            <button class="btn-reject" onclick="updateStatus(${req.id}, 'مرفوض')"><i class="fa-solid fa-xmark"></i> رفض</button>
                            <button class="btn-video" onclick="startAdminVideoCall('${req.customer_phone}')"><i class="fa-solid fa-video"></i> فيديو</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function updateStatus(id, status) {
            await window.supabaseClient.from('service_requests').update({ status: status }).eq('id', id);
            loadAdminRequests();
        }

        function updateStats(requests) {
            document.getElementById('statTotal').innerText = requests.length;
            document.getElementById('statPending').innerText = requests.filter(r => !r.status || r.status === 'قيد الانتظار').length;
            document.getElementById('statApproved').innerText = requests.filter(r => r.status === 'موافقة').length;
        }
    </script>
</body>
</html>
