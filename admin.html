<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة إدارة - SNelectric</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;direction:rtl;padding:16px} table{width:100%;border-collapse:collapse} th,td{padding:8px;border:1px solid #ccc;text-align:right}</style>
</head>
<body>
  <h1>لوحة إدارة الطلبات</h1>

  <section id="admin-auth">
    <h3>دخول الأدمن</h3>
    <label>رقم الهاتف<br><input type="text" id="admin_phone" placeholder="201287837118" /></label><br>
    <label>كلمة المرور<br><input type="password" id="admin_password" /></label><br>
    <button id="admin-signin">دخول</button>
    <div id="admin-status"></div>
  </section>

  <hr />

  <div id="status"></div>
  <table id="orders-table">
    <thead><tr><th>#</th><th>هاتف</th><th>تفاصيل</th><th>المجموع</th><th>حالة</th><th>واتساب</th><th>إجراءات</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="/js/config.example.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.getElementById('admin-signin').addEventListener('click', async ()=>{
      const phone = document.getElementById('admin_phone').value.trim();
      const pass = document.getElementById('admin_password').value;
      if(!phone || !pass) return alert('ادخل رقم وكلمة المرور');
      try{
        await signInWithPhone(phone, pass);
        document.getElementById('admin-status').innerText = 'تم تسجيل دخول الأدمن';
        await loadOrders();
      }catch(e){ console.error(e); alert('فشل الدخول: '+(e.message||e)); }
    });
  </script>
</body>
</html>
