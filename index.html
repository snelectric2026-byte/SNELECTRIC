<!-- زر محادثة المشروع الآمنة (يظهر للعميل المعتمد فقط) -->
<div id="floatingSecureChatContainer"></div>

<!-- صندوق محادثة المشروع الآمنة (مخفي افتراضياً ولا يظهر إلا بعد الاعتماد) -->
<div id="approvedChatWidget" style="display: none; position: fixed; bottom: 25px; left: 25px; width: 350px; max-width: 90vw; height: 450px; background: #111e38; border: 2px solid var(--accent); border-radius: 15px; flex-direction: column; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden;">
    <div class="chat-header" style="background: var(--dark); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <span style="font-weight: bold; color: var(--accent);"><i class="fa-solid fa-comments"></i> محادثة مشروع SN ELECTRIC الآمنة</span>
        <span style="cursor: pointer; font-size: 18px; color: #fff;" onclick="toggleApprovedChat()">&times;</span>
    </div>
    <div class="chat-body" id="approvedChatBody" style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #fff;">
        <div class="chat-message incoming" style="background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; max-width: 80%;">مرحباً بك! تمت الموافقة على طلبك. يمكنك مراسلة الإدارة مباشرة من هنا لضمان سرية وحفظ كافة تفاصيل المشروع.</div>
    </div>
    <div class="chat-footer" style="padding: 10px; background: var(--dark); display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.1);">
        <input type="text" id="approvedChatInput" placeholder="اكتب رسالتك هنا..." style="flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: #0d1729; color: #fff;" onkeypress="if(event.key==='Enter') sendApprovedMessage()">
        <button onclick="sendApprovedMessage()" style="background: var(--accent); color: var(--dark); border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">إرسال</button>
    </div>
</div>
