<!-- نافذة حاسبة التكلفة الشاملة والطلب -->
<div id="formModal" class="modal">
    <div class="modal-content" style="max-width: 600px; max-height: 90vh; overflow-y: auto;">
        <span class="close-btn" onclick="closeForm()">&times;</span>
        <h3 id="formTitle" style="color: #f1c40f; margin-bottom: 15px;">حاسبة التكلفة والطلب التفصيلي</h3>
        
        <form id="serviceForm" onsubmit="handleFormSubmit(event)">
            <!-- بيانات العميل الأساسية -->
            <div class="form-group">
                <label>الاسم بالكامل *</label>
                <input type="text" id="customerName" placeholder="أدخل اسمك الكريم" required>
            </div>

            <div class="form-group">
                <label>رقم الهاتف *</label>
                <input type="tel" id="customerPhone" placeholder="01xxxxxxxxx" required>
            </div>

            <div class="form-group">
                <label>العنوان بالتفصيل *</label>
                <input type="text" id="customerAddress" placeholder="المنطقة / الشارع / رقم العقار" required>
            </div>

            <div class="form-group">
                <label>نوع المقر / المشروع *</label>
                <select id="projectType" onchange="calculateTotal()" required style="width:100%; padding:10px; background:#07101d; color:#fff; border:1px solid rgba(255,255,255,0.1); border-radius:6px;">
                    <option value="flat">تأسيس شقة / سقف</option>
                    <option value="shop">تأسيس محل (خصم 5 ج.م لكل بند)</option>
                    <option value="factory">تأسيس مصنع (يدعم مواسير MTK)</option>
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

            <!-- قسم 1: التاسيس والمواسير -->
            <h4 style="color: #3498db; margin-bottom: 10px;"><i class="fa-solid fa-plug"></i> بند التأسيس والمواسير</h4>
            
            <div class="form-group">
                <label>أنواع المواسير المستخدمة (يمكن اختيار أكثر من نوع):</label>
                <div style="display:flex; gap:15px; margin-top:5px; color:#fff;">
                    <label><input type="checkbox" id="pipeKharta" onchange="calculateTotal()"> خرطوم (20 ج/م)</label>
                    <label><input type="checkbox" id="pipePVC" onchange="calculateTotal()"> PVC شامل اللزق (50 ج/م)</label>
                    <label id="mtkOption" style="display:none;"><input type="checkbox" id="pipeMTK" onchange="calculateTotal()"> MTK معدني (65 ج/م)</label>
                </div>
            </div>

            <div class="form-group">
                <label>أمتار المواسير المطلوبة (المجموع بالمتر):</label>
                <input type="number" id="pipeMeters" placeholder="0" oninput="calculateTotal()" min="0">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="form-group">
                    <label>عدد نقاط السقف * (25 ج)</label>
                    <input type="number" id="roofPoints" placeholder="إجباري" oninput="calculateTotal()" required min="0">
                </div>
                <div class="form-group">
                    <label>عدد اللوح * (150 ج)</label>
                    <input type="number" id="panelsCount" placeholder="إجباري" oninput="calculateTotal()" required min="0">
                </div>
                <div class="form-group">
                    <label>عدد البرايز * (60 ج)</label>
                    <input type="number" id="socketsCount" placeholder="إجباري" oninput="calculateTotal()" required min="0">
                </div>
                <div class="form-group">
                    <label>علب السكة / البواط (40 ج)</label>
                    <input type="number" id="junctionBoxes" placeholder="اختياري" oninput="calculateTotal()" min="0">
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

            <!-- قسم 2: التشطيب والتجهيزات -->
            <h4 style="color: #3498db; margin-bottom: 10px;"><i class="fa-solid fa-sliders"></i> بند التشطيب</h4>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="form-group"><label>عدد المفاتيح (20 ج):</label><input type="number" id="switchesCount" oninput="calculateTotal()" placeholder="0"></div>
                <div class="form-group"><label>عدد المواتير (150 ج):</label><input type="number" id="motorsCount" oninput="calculateTotal()" placeholder="0"></div>
                <div class="form-group"><label>عدد التكييفات (120 ج):</label><input type="number" id="acCount" oninput="calculateTotal()" placeholder="0"></div>
                <div class="form-group"><label>عدد الخطوط (30 ج):</label><input type="number" id="linesCount" oninput="calculateTotal()" placeholder="0"></div>
                <div class="form-group"><label>عدد اللمبات (15 ج):</label><input type="number" id="lampsCount" oninput="calculateTotal()" placeholder="0"></div>
                <div class="form-group"><label>عدد النجف (100 ج):</label><input type="number" id="chandeliersCount" oninput="calculateTotal()" placeholder="0"></div>
                <div class="form-group"><label>مراوح سقف (50 ج):</label><input type="number" id="ceilingFans" oninput="calculateTotal()" placeholder="0"></div>
                <div class="form-group"><label>مراوح حائط (40 ج):</label><input type="number" id="wallFans" oninput="calculateTotal()" placeholder="0"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

            <!-- قسم 3: الكاميرات والأنظمة الأمنية والإطفاء -->
            <h4 style="color: #3498db; margin-bottom: 10px;"><i class="fa-solid fa-video"></i> الأنظمة الكاميرات والانذار والإطفاء</h4>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="form-group">
                    <label>عدد الكاميرات (150 ج):</label>
                    <input type="number" id="camsCount" oninput="calculateTotal()" placeholder="0">
                </div>
                <div class="form-group">
                    <label>نوع الكاميرا:</label>
                    <select id="camType" style="width:100%; padding:8px; background:#07101d; color:#fff; border:1px solid rgba(255,255,255,0.1); border-radius:6px;">
                        <option value="داخلي">داخلي (Internal)</option>
                        <option value="خارجي">خارجي (External)</option>
                        <option value="بصوت">مزودة بصوت (Audio)</option>
                        <option value="متحركة">متحركة PTZ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نوع DVR / NVR:</label>
                    <select id="dvrType" style="width:100%; padding:8px; background:#07101d; color:#fff; border:1px solid rgba(255,255,255,0.1); border-radius:6px;">
                        <option value="4 قنوات">4 قنوات (4CH)</option>
                        <option value="8 قنوات">8 قنوات (8CH)</option>
                        <option value="16 قناة">16 قناة (16CH)</option>
                        <option value="32 قناة">32 قناة (32CH)</option>
                    </select>
                </div>
            </div>

            <!-- انذار وحريق -->
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                <div class="form-group">
                    <label>زونات إنذار (حريق/دخان) (100ج):</label>
                    <input type="number" id="alarmZones" oninput="calculateTotal()" placeholder="0">
                </div>
                <div class="form-group">
                    <label>زونات إطفاء (رشاشات/حساسات) (150ج):</label>
                    <input type="number" id="fireZones" oninput="calculateTotal()" placeholder="0">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>أمتار مواسير الإطفاء (نحاس/حديد) (75 ج/م):</label>
                    <input type="number" id="firePipesMeters" oninput="calculateTotal()" placeholder="0">
                </div>
            </div>

            <!-- النتيجة الإجمالية -->
            <div style="background: rgba(241, 196, 15, 0.15); border: 1px solid #f1c40f; padding: 15px; border-radius: 8px; text-align: center; margin: 20px 0;">
                <span style="font-size: 15px; color: #fff;">التكلفة التقديرية الإجمالية:</span>
                <h2 id="totalPriceDisplay" style="color: #f1c40f; font-size: 26px; margin-top: 5px;">0 ج.م</h2>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">حفظ الطلب وتأكيد الإرسال</button>
        </form>
    </div>
</div>
